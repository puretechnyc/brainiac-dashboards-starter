<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paid Ads Dashboard</title>
<style>
:root {
  color-scheme: light;
  --bg:#f5f5f2;
  --surface:#ffffff;
  --surface-2:#fafaf8;
  --sunk:#f0f0ec;
  --ink:#15171c;
  --ink-2:#454a54;
  --muted:#676c76;
  --line:#e5e4df;
  --line-2:#d6d5cf;
  --accent:#1f5fbf;
  --accent-tint:#e8f0fc;
  --good:#0f7a32;
  --good-tint:#e6f4ea;
  --good-mark:#0ca30c;
  --watch:#8f5a00;
  --watch-tint:#fdf2d8;
  --watch-mark:#e09b00;
  --bad:#c02a2a;
  --bad-tint:#fbe8e7;
  --bad-mark:#d03b3b;
  --none:#5d626b;
  --none-tint:#eeeeea;
  --none-mark:#9a9ea6;
  --meta:#2a78d6;
  --google:#eb6834;
  --series:#2a78d6;
  --series-soft:#2a78d655;
  --shade:#f2f1ed;
  --grid:#ecebe6;
  --hl:#15171c0d;
  --shadow:0 1px 2px rgba(20,22,28,.05),0 1px 1px rgba(20,22,28,.03);
  --shadow-pop:0 12px 32px rgba(20,22,28,.16),0 2px 6px rgba(20,22,28,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    color-scheme: dark;
    --bg:#0f1012;
    --surface:#18191c;
    --surface-2:#1d1e22;
    --sunk:#141518;
    --ink:#f0efec;
    --ink-2:#c6c5c0;
    --muted:#9c9c97;
    --line:#2b2d32;
    --line-2:#3a3c42;
    --accent:#7aa7ff;
    --accent-tint:#1c2a44;
    --good:#5bcf78;
    --good-tint:#15291b;
    --good-mark:#0ca30c;
    --watch:#f2b84a;
    --watch-tint:#2d2412;
    --watch-mark:#fab219;
    --bad:#f27b7b;
    --bad-tint:#331a1a;
    --bad-mark:#d03b3b;
    --none:#a9a9a4;
    --none-tint:#242528;
    --none-mark:#6d7078;
    --meta:#3987e5;
    --google:#d95926;
    --series:#3987e5;
    --series-soft:#3987e555;
    --shade:#1c1d21;
    --grid:#26282c;
    --hl:#ffffff10;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-pop:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme=dark] {
  color-scheme: dark;
  --bg:#0f1012;
  --surface:#18191c;
  --surface-2:#1d1e22;
  --sunk:#141518;
  --ink:#f0efec;
  --ink-2:#c6c5c0;
  --muted:#9c9c97;
  --line:#2b2d32;
  --line-2:#3a3c42;
  --accent:#7aa7ff;
  --accent-tint:#1c2a44;
  --good:#5bcf78;
  --good-tint:#15291b;
  --good-mark:#0ca30c;
  --watch:#f2b84a;
  --watch-tint:#2d2412;
  --watch-mark:#fab219;
  --bad:#f27b7b;
  --bad-tint:#331a1a;
  --bad-mark:#d03b3b;
  --none:#a9a9a4;
  --none-tint:#242528;
  --none-mark:#6d7078;
  --meta:#3987e5;
  --google:#d95926;
  --series:#3987e5;
  --series-soft:#3987e555;
  --shade:#1c1d21;
  --grid:#26282c;
  --hl:#ffffff10;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
}
* {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family:
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Helvetica Neue",
    Arial,
    sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.num,
td,
th,
.kpi .v,
.metric {
  font-variant-numeric: tabular-nums;
}
a {
  color: var(--accent);
  text-decoration: none;
}
button {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 24px;
}
.na {
  color: var(--muted);
}
.muted {
  color: var(--muted);
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 58px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 650;
  letter-spacing: -.01em;
  white-space: nowrap;
  color: var(--ink);
}
.brand .mark {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: var(--ink);
  color: var(--surface);
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .01em;
}
.brand small {
  color: var(--muted);
  font-weight: 500;
}
.switcher {
  position: relative;
  flex: 0 1 340px;
  min-width: 0;
}
.sw-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
  text-align: left;
}
.sw-btn:hover {
  border-color: var(--muted);
}
.sw-btn .nm {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
}
.sw-btn .car {
  color: var(--muted);
  font-size: 11px;
}
.sw-btn kbd,
.kbd {
  font:
    11px ui-monospace,
    Menlo,
    monospace;
  color: var(--muted);
  border: 1px solid var(--line-2);
  border-radius: 5px;
  padding: 1px 5px;
}
.pop {
  position: absolute;
  top: 44px;
  left: 0;
  width: min(420px, calc(100vw - 32px));
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  box-shadow: var(--shadow-pop);
  padding: 8px;
  display: none;
}
.pop.open {
  display: block;
}
.pop input {
  width: 100%;
  height: 38px;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  padding: 0 12px;
  background: var(--surface-2);
  color: var(--ink);
  font: inherit;
  margin-bottom: 6px;
}
.pop ul {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: min(60vh, 440px);
  overflow: auto;
}
.pop li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
}
.pop li .nm {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pop li .v {
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.pop li.act,
.pop li:hover {
  background: var(--sunk);
}
.pop li.cur .nm {
  font-weight: 650;
}
.pop .sep {
  height: 1px;
  background: var(--line);
  margin: 4px 2px;
}
.spacer {
  flex: 1;
}
.navgrp {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}
.fresh {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12.5px;
  white-space: nowrap;
}
.fresh .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--good-mark);
  box-shadow: 0 0 0 3px var(--good-tint);
}
.fresh.stale {
  color: var(--bad);
  font-weight: 650;
}
.fresh.stale .dot {
  background: var(--bad-mark);
  box-shadow: 0 0 0 3px var(--bad-tint);
}
.iconbtn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--ink-2);
  flex: none;
}
.iconbtn:hover {
  border-color: var(--muted);
}
.iconbtn svg {
  width: 18px;
  height: 18px;
}
.stalebar {
  background: var(--bad-tint);
  color: var(--bad);
  border-bottom: 1px solid var(--line);
  font-weight: 600;
  font-size: 13px;
}
.stalebar .wrap {
  padding-top: 9px;
  padding-bottom: 9px;
}
.page-h {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin: 28px 0 18px;
}
.page-h h1 {
  font-size: 26px;
  line-height: 1.15;
  letter-spacing: -.02em;
  margin: 0;
  font-weight: 700;
}
.page-h .sub {
  color: var(--muted);
  margin-top: 6px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.sec {
  margin: 0 0 20px;
  scroll-margin-top: 76px;
}
.sec > .card {
  padding: 20px 22px;
}
.sec-h {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin: 0 0 14px;
}
.sec-h h2 {
  font-size: 16px;
  margin: 0;
  font-weight: 650;
  letter-spacing: -.005em;
}
.sec-h .hint {
  color: var(--muted);
  font-size: 12.5px;
}
h3 {
  font-size: 13.5px;
  margin: 18px 0 10px;
  font-weight: 650;
}
.note {
  color: var(--muted);
  font-size: 12.5px;
  margin-top: 10px;
  line-height: 1.55;
}
.note b {
  color: var(--ink-2);
  font-weight: 600;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--none-tint);
  color: var(--none);
  white-space: nowrap;
  vertical-align: middle;
}
.tag.draft {
  background: var(--watch-tint);
  color: var(--watch);
}
.tag.meta {
  background: color-mix(in srgb, var(--meta) 14%, transparent);
  color: var(--ink-2);
}
.tag.google {
  background: color-mix(in srgb, var(--google) 14%, transparent);
  color: var(--ink-2);
}
.pdot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  margin-right: 6px;
  vertical-align: 1px;
}
.pdot.meta {
  background: var(--meta);
}
.pdot.google {
  background: var(--google);
}
.st {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px 0 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
}
.st svg {
  width: 13px;
  height: 13px;
  flex: none;
}
.st.on {
  background: var(--good-tint);
  color: var(--good);
}
.st.watch {
  background: var(--watch-tint);
  color: var(--watch);
}
.st.off,
.st.need {
  background: var(--bad-tint);
  color: var(--bad);
}
.st.none,
.st.nl {
  background: var(--none-tint);
  color: var(--none);
}
.sdot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex: none;
  background: var(--none-mark);
}
.sdot.on {
  background: var(--good-mark);
}
.sdot.watch {
  background: var(--watch-mark);
}
.sdot.off,
.sdot.need {
  background: var(--bad-mark);
}
.delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-weight: 650;
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.delta.good {
  color: var(--good);
}
.delta.bad {
  color: var(--bad);
}
.delta.flat,
.delta.na {
  color: var(--muted);
  font-weight: 500;
}
.flagct {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 650;
  padding: 1px 7px;
  border-radius: 999px;
  white-space: nowrap;
}
.flagct.red {
  background: var(--bad-tint);
  color: var(--bad);
}
.flagct.amber {
  background: var(--watch-tint);
  color: var(--watch);
}
.flagct svg {
  width: 11px;
  height: 11px;
}
.bullet {
  position: relative;
  height: 6px;
  border-radius: 3px;
  background: var(--sunk);
  margin-top: 8px;
  overflow: visible;
}
.bullet i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  border-radius: 3px;
}
.bullet i.on {
  background: var(--good-mark);
}
.bullet i.watch {
  background: var(--watch-mark);
}
.bullet i.off {
  background: var(--bad-mark);
}
.bullet b {
  position: absolute;
  top: -4px;
  bottom: -4px;
  width: 2px;
  background: var(--ink);
  border-radius: 1px;
}
.tiles {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}
.tile {
  padding: 14px 16px;
  text-align: left;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow);
  transition: border-color .12s;
}
.tile:hover {
  border-color: var(--line-2);
}
.tile[aria-pressed=true] {
  border-color: var(--ink);
  box-shadow: 0 0 0 1px var(--ink);
}
.tile.static {
  cursor: default;
}
.tile .k {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.tile .v {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-top: 4px;
  line-height: 1.1;
}
.tile .s {
  color: var(--muted);
  font-size: 12px;
  margin-top: 3px;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 0 0 12px;
}
.search {
  position: relative;
  flex: 1 1 260px;
  max-width: 380px;
}
.search input {
  width: 100%;
  height: 38px;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 0 36px 0 36px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
}
.search svg {
  position: absolute;
  left: 11px;
  top: 11px;
  width: 16px;
  height: 16px;
  color: var(--muted);
}
.search .kbd {
  position: absolute;
  right: 10px;
  top: 10px;
}
select.ctl {
  height: 38px;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 0 30px 0 12px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}
.seg {
  display: inline-flex;
  background: var(--sunk);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
  flex-wrap: wrap;
}
.seg button {
  border: 0;
  background: transparent;
  padding: 6px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  white-space: nowrap;
}
.seg button[aria-pressed=true] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.seg button .c {
  color: var(--muted);
  font-weight: 500;
  margin-left: 4px;
}
.clist {
  overflow: hidden;
}
.crow {
  display: grid;
  grid-template-columns: minmax(190px, 1.5fr) 118px minmax(150px, 1.25fr) 150px 112px 120px 92px 104px;
  gap: 18px;
  align-items: center;
  padding: 16px 20px;
  border-top: 1px solid var(--line);
  color: inherit;
  cursor: pointer;
}
.crow:hover {
  background: var(--surface-2);
}
.crow.head {
  cursor: default;
  border-top: 0;
  padding-top: 12px;
  padding-bottom: 12px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: .02em;
  text-transform: uppercase;
}
.crow.head:hover {
  background: var(--surface-2);
}
.crow .r {
  text-align: right;
}
.cname {
  font-weight: 650;
  font-size: 15px;
  letter-spacing: -.005em;
  color: var(--ink);
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cmeta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 12px;
  margin-top: 3px;
}
.metric {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -.015em;
  line-height: 1.15;
}
.metric small {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0;
  margin-left: 4px;
}
.why {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}
.cell-lbl {
  display: none;
}
.spark {
  display: block;
}
.empty {
  padding: 36px 20px;
  text-align: center;
  color: var(--muted);
}
.legend-line {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 12px;
  margin: 12px 2px 0;
}
.legend-line span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.detail {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
.rail {
  position: sticky;
  top: 78px;
  padding-top: 4px;
}
.rail a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 10px;
  border-radius: 8px;
  color: var(--ink-2);
  font-weight: 550;
  font-size: 13px;
}
.rail a:hover {
  background: var(--sunk);
  color: var(--ink);
}
.rail a.cur {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}
.rail a .c {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}
.rail .back {
  color: var(--muted);
  margin-bottom: 10px;
}
.chead {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
  margin: 26px 0 18px;
}
.chead h1 {
  font-size: 28px;
  letter-spacing: -.02em;
  line-height: 1.15;
  margin: 0 0 8px;
  font-weight: 700;
}
.chead .line {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--muted);
}
.accts {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.accts .tag {
  font-weight: 550;
  height: auto;
  padding: 3px 9px;
}
.pn {
  display: flex;
  gap: 6px;
}
.pn .iconbtn {
  width: auto;
  padding: 0 12px;
  gap: 6px;
  display: inline-flex;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
}
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) repeat(2, minmax(0, 1fr));
  grid-template-rows: auto auto;
  gap: 12px;
}
.kpi {
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  min-width: 0;
}

function chartSVG(S, k, W, H, target, plat) {
  W = Math.max(220, W || 300);
  const pl = 46, pr = 8, pt = 18, pb = 22;
  const iw = W - pl - pr, ih = H - pt - pb;
  const n = S.length, bw = iw / n;
  const vals = S.map((s) => s[k]);
  let max = Math.max(0, ...vals.filter((v) => v != null));
  if (k === "cpr" && target != null) max = Math.max(max, target);
  max = niceMax(max * 1.05);
  const y = (v) => pt + ih - v / max * ih;
  const fmtY = (v) => k === "results" ? plat === "google" && v % 1 ? v.toFixed(1) : Math.round(v * 10) / 10 + "" : compact(v);
  let o = '<svg width="' + W + '" height="' + H + '" data-x0="' + pl + '" data-bw="' + bw + '" role="img" aria-label="' + k + ' by day">';
  const firstTw = S.findIndex((s) => s.tw);
  if (firstTw > 0) {
    o += '<rect x="' + pl + '" y="' + pt + '" width="' + (firstTw * bw).toFixed(1) + '" height="' + ih + '" fill="var(--shade)"/><text x="' + (pl + 4) + '" y="' + (pt - 6) + '">Prior</text>';
  }
  if (firstTw >= 0) o += '<text x="' + (pl + firstTw * bw + 4) + '" y="' + (pt - 6) + '">Last ' + DATA.windows.this_week.days + " days</text>";
  [0, 0.5, 1].forEach((f) => {
    const v = max * f, yy = y(v);
    o += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/><text x="' + (pl - 6) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end">' + fmtY(v) + "</text>";
  });
  o += '<rect class="hl" x="' + pl + '" data-x0="' + pl + '" data-bw="' + bw + '" y="' + pt + '" width="' + bw.toFixed(1) + '" height="' + ih + '" fill="var(--hl)" style="display:none"/>';
  if (k === "cpr") {
    if (target != null) {
      const ty = y(target);
      o += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + ty.toFixed(1) + '" y2="' + ty.toFixed(1) + '" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="4 3"/>';
    }
    let path = "", pen = false;
    S.forEach((s, i) => {
      const cx = pl + i * bw + bw / 2;
      if (s.cpr == null) {
        pen = false;
        return;
      }
      path += (pen ? "L" : "M") + cx.toFixed(1) + " " + y(s.cpr).toFixed(1);
      pen = true;
    });
    o += '<path d="' + path + '" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    S.forEach((s, i) => {
      if (s.cpr == null) {
        if (s.results === 0 && s.spend > 0) o += '<text x="' + (pl + i * bw + bw / 2).toFixed(1) + '" y="' + (pt + ih - 4) + '" text-anchor="middle" style="font-size:9px">0</text>';
        return;
      }
      o += '<circle cx="' + (pl + i * bw + bw / 2).toFixed(1) + '" cy="' + y(s.cpr).toFixed(1) + '" r="3.5" fill="var(--series)" stroke="var(--surface)" stroke-width="2" opacity="' + (s.tw ? 1 : 0.55) + '"/>';
    });
  } else {
    const w = Math.min(22, Math.max(3, bw - 4));
    S.forEach((s, i) => {
      const v = s[k];
      if (v == null || v <= 0) return;
      const x = pl + i * bw + (bw - w) / 2, yy = y(v), hh = pt + ih - yy;
      const r = Math.min(3, w / 2, hh);
      o += '<path d="M' + x.toFixed(1) + " " + (pt + ih) + "V" + (yy + r).toFixed(1) + "q0 -" + r + " " + r + " -" + r + "h" + (w - 2 * r).toFixed(1) + "q" + r + " 0 " + r + " " + r + "V" + (pt + ih) + 'Z" fill="var(--series)" opacity="' + (s.tw ? 1 : 0.45) + '"/>';
    });
  }
  o += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '" stroke="var(--line-2)"/>';
  const every = n > 9 && iw / n < 34 ? 2 : 1;
  S.forEach((s, i) => {
    if ((n - 1 - i) % every) return;
    const p = pd(s.date);
    o += '<text x="' + (pl + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + (i === 0 || p.d === 1 ? MON[p.m - 1] + " " + p.d : p.d) + "</text>";
  });
  return o + "</svg>";
}
let rT;
addEventListener("resize", () => {
  clearTimeout(rT);
  rT = setTimeout(redrawCharts, 120);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  applyTheme(theme());
});
function init() {
  DATA.client_order = DATA.client_order && DATA.client_order.length ? DATA.client_order : Object.keys(DATA.clients || {});
  DATA.windows = DATA.windows || {};
  DATA.windows.this_week = DATA.windows.this_week || { days: 7 };
  DATA.windows.all = DATA.windows.all || {};
  DATA.notes = DATA.notes || {};
  Object.keys(DATA.clients || {}).forEach((n) => {
    CUR = cliCur(n);
    STATUS[n] = statusOf(DATA.clients[n], n);
  });
  CUR = "USD";
  const age = (Date.now() / 1e3 - Number(DATA.data_as_of_epoch)) / 3600;
  $("#freshTxt").innerHTML = "Data as of " + asofTxt(DATA.data_as_of_et);
  $("#fresh").title = "Data as of " + (DATA.data_as_of_et || "") + " | run " + (DATA.run_id || "") + " | data " + (DATA.windows.all.start || "") + " to " + (DATA.windows.all.end || "") + " (" + (DATA.windows.all.days || "") + " days)";
  if (!(age <= 26)) {
    $("#fresh").classList.add("stale");
    $("#freshTxt").innerHTML = "STALE &middot; " + asofTxt(DATA.data_as_of_et);
    $("#stale").innerHTML = '<div class="stalebar"><div class="wrap">STALE: data as of ' + esc(DATA.data_as_of_et) + " (run " + esc(DATA.run_id) + "). The latest clean run is " + (isFinite(age) ? Math.round(age) + "h old" : "of unknown age") + ", over the 26h limit.</div></div>";
  }
  $("#foot").textContent = "Paid Ads Dashboard. Source: data.json, built " + DATA.generated_at + ". All platform metrics are platform-reported (Meta / Google), not your own sales records.";
  try {
    const qp = new URLSearchParams(location.search).get("client");
    if (qp && DATA.clients[qp] && !location.hash) history.replaceState(null, "", "#/c/" + encodeURIComponent(qp));
  } catch (e) {
  }
  route();
}
fetch("data.json?v=" + Date.now()).then((r) => {
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}).then((d) => {
  DATA = d;
  init();
}).catch((e) => {
  $("#app").innerHTML = '<div class="card" style="padding:40px;margin-top:28px">Failed to load data.json: ' + esc(e) + "</div>";
});</script>
