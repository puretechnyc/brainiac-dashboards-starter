# Cloudflare Workers settings for the time tracker.
# Fill in the two PLACEHOLDER values, then run `npm run deploy`.
# Never put passwords or API keys in this file. Use `wrangler secret put NAME` instead
# (see .dev.vars.example for the list).

name = "time-tracker"
main = "worker/src/index.js"
compatibility_date = "2026-08-01"

# The website (./public) is served straight from Cloudflare; /api/* goes to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# The database. Create it with:  npx wrangler d1 create time-tracker-db
# then paste the database_id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "time-tracker-db"
database_id = "PLACEHOLDER_D1_DATABASE_ID"

# Optional: run the weekly lock / behind-pace checks on a schedule.
# [triggers]
# crons = ["*/15 * * * *"]
